<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="rib" x1="170" y1="340" x2="854" y2="690" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1E1466"/>
      <stop offset="0.5" stop-color="#4B22C9"/>
      <stop offset="1" stop-color="#8E3BFF"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="304" x2="0" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="450" x2="0" y2="580" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2A1880"/>
      <stop offset="1" stop-color="#120A45"/>
    </linearGradient>
    <mask id="leftLoop" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024"><path d="M512,512 L400,352 L250,352 L170,512 L250,672 L400,672 L512,512" fill="none" stroke="#fff" stroke-width="96"/></mask>
    <mask id="strandB" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024"><path d="M624,672 L512,512 L400,352" fill="none" stroke="#fff" stroke-width="96"/></mask>
    <clipPath id="cross"><rect x="430" y="400" width="164" height="224"/></clipPath>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0B0630" flood-opacity="0.5"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.09"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="#F5F3EE"/>

  <g transform="translate(512 512) scale(0.86) translate(-512 -512)">
    <ellipse cx="512" cy="760" rx="310" ry="24" fill="#1E1466" opacity="0.22" filter="url(#blur)"/>

    <!-- angular figure-eight: two hexagonal loops -->
    <path d="M512,512 L400,352 L250,352 L170,512 L250,672 L400,672 L512,512" fill="none" stroke="url(#rib)" stroke-width="96" stroke-linejoin="miter"/>
    <path d="M512,512 L624,352 L774,352 L854,512 L774,672 L624,672 L512,512" fill="none" stroke="url(#rib)" stroke-width="96" stroke-linejoin="miter"/>

    <!-- lower-left run breaks into a calendar grid -->
    <g mask="url(#leftLoop)">
      <path d="M182,536 L250,672 L400,672 L455,594" fill="none" stroke="#F5F3EE" stroke-width="38" stroke-linejoin="miter"/>
      <path d="M182,536 L250,672 L400,672 L455,594" fill="none" stroke="url(#rib)" stroke-width="32" stroke-linejoin="miter"/>
      <g stroke="#F5F3EE" stroke-width="5">
        <path d="M280,610 V734 M316,610 V734 M352,610 V734 M388,610 V734"/>
        <path d="M148,571 L256,517 M164,603 L272,549 M180,635 L288,581 M196,667 L304,613"/>
        <path d="M373,606 L472,675"/>
      </g>
    </g>

    <!-- crossing: right strand passes over -->
    <g clip-path="url(#cross)">
      <g mask="url(#strandB)"><path d="M624,352 L512,512 L400,672" fill="none" stroke="#0B0630" stroke-width="110" opacity="0.5" filter="url(#blur)" transform="translate(0 8)"/></g>
      <path d="M624,352 L512,512 L400,672" fill="none" stroke="url(#rib)" stroke-width="96"/>
    </g>

    <!-- checkbox whose tick refuses to stay inside -->
    <rect x="647" y="447" width="130" height="130" rx="10" fill="url(#box)"/>
    <rect x="647" y="447" width="130" height="130" rx="10" fill="none" stroke="#B9A6FF" stroke-width="4" opacity="0.5"/>
    <path d="M670,512 L704,550 L816,326" fill="none" stroke="#C6F400" stroke-width="22" stroke-linecap="square" stroke-linejoin="miter" filter="url(#glow)"/>

    <!-- gloss on top edges -->
    <path d="M400,352 L250,352 L170,512 M624,352 L774,352 L854,512" fill="none" stroke="url(#gloss)" stroke-width="96" stroke-linejoin="miter"/>
  </g>

  <rect width="1024" height="1024" filter="url(#grain)"/>
</svg>
